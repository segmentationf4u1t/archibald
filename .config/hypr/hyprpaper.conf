# hyprpaper 0.8.x – pusty "monitor" = fallback dla wszystkich wyjść
# (nazwy złączy zmieniają się między uruchomieniami, więc nie używamy ich).
# Tapety: ~/Pictures/Wallpapers (źródło/licencja: SOURCE.txt). Zmiana: ALT+W (wybór), ALT+SHIFT+W (następna);
# skrypt ~/.local/bin/wallpaper podmienia linię "path" poniżej.
splash = false

wallpaper {
    monitor =
    path = ~/Pictures/Wallpapers/seedream-dark-jester.jpg
    fit_mode = cover
}
