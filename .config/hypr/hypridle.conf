# hypridle 0.1.x – bez blokady i wygaszania z bezczynności (blokada ręcznie: ALT+SHIFT+L);
# zostaje tylko blokada przed uśpieniem systemu i włączenie ekranów po wznowieniu.
general {
    lock_cmd = pidof hyprlock || hyprlock                             # nie uruchamiaj wielu instancji hyprlock
    before_sleep_cmd = loginctl lock-session                          # zablokuj przed uśpieniem
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # włącz ekrany po wznowieniu
}
