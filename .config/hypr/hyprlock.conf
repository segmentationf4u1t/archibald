# hyprlock 0.9.x – dark-volcanic (Tern/omp): rozmyty zrzut ekranu, godzina, data, pole hasła.
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
    color = rgb(16, 9, 8)
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 3
    inner_color = rgba(26, 16, 14, 0.85)
    outer_color = rgb(255, 122, 61) rgb(243, 194, 79) 45deg
    check_color = rgb(243, 194, 79)
    fail_color = rgb(255, 92, 92)
    font_color = rgb(235, 223, 216)
    fade_on_empty = false
    rounding = 16
    font_family = $font
    placeholder_text = Hasło...
    fail_text = $PAMFAIL
    dots_spacing = 0.3

    position = 0, -40
    halign = center
    valign = center
}

# Godzina
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = rgb(255, 122, 61)

    position = 0, 140
    halign = center
    valign = center
}

# Data
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 24
    font_family = $font
    color = rgb(235, 223, 216)

    position = 0, 60
    halign = center
    valign = center
}
