; Looking Glass B7-829-cdba29f2
; Klawiatura Vulcan II Mini nie ma ScrollLocka, wiec klawiszem specjalnym jest prawy Ctrl:
;   prawy Ctrl         - wejscie/wyjscie z trybu przechwytywania (mysz i klawiatura tylko dla Windowsa)
;   prawy Ctrl + F     - pelny ekran
;   prawy Ctrl + Q     - zamkniecie klienta
;   przytrzymaj prawy Ctrl - lista skrotow

[win]
title=Windows
; Okno zmienia rozdzielczosc Windowsa (wirtualny monitor IDD) do swojego rozmiaru.
setGuestRes=yes
noScreensaver=yes

[input]
escapeKey=KEY_RIGHTCTRL
rawMouse=yes

[spice]
clipboard=yes
audio=yes
